name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: bun check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
      # Pin by semver tag so Actions always resolves (commit SHAs are easy to typo and then fail to resolve).
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run depcruise
      - run: bun run check:core-purity
      - run: bun test

  arch-invariants:
    name: core purity (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3.13'
      - run: bun run check:core-purity
