name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: bun check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
      # Pin by semver tag so Actions always resolves (commit SHAs are easy to typo and then fail to resolve).
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run depcruise
      - run: bun test

  arch-invariants:
    name: core purity (grep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
      - name: banned patterns in src/core
        run: |
          set -euo pipefail
          if [ ! -d src/core ]; then echo 'OK (no src/core yet)'; exit 0; fi
          # GNU grep on ubuntu-latest — same semantics as rg: exit 0 iff matches found.
          if grep -rHnE --include='*.ts' 'process\.|Bun\.|fetch\(|Date\.now|Math\.random' src/core; then
            echo 'Banned pattern in src/core — use ports + runtime instead.'
            exit 1
          fi
          echo 'OK: no banned patterns under src/core'
