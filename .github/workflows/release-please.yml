name: release-please

on:
  push:
    branches: [main]

# Do not set workflow-wide `permissions: contents: read` here — it caps GITHUB_TOKEN for
# every job, so job-level `pull-requests: write` cannot apply and release-please fails.

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
