name: release-binaries

# Builds standalone `aimo` with `bun build --compile` and attaches all platform assets
# to one GitHub Release (avoids parallel action-gh-release races on the same tag).
#
# Runs when:
# - A release is published (e.g. release-please), or
# - A version tag is pushed (`v*`), or
# - workflow_dispatch with an existing tag.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach assets to (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: aimo-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: aimo-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            asset: aimo-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64
            asset: aimo-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: '1.3.13'

      - run: bun install --frozen-lockfile

      - name: bun build --compile
        run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} \
            src/app/cli.ts --outfile dist/${{ matrix.asset }}

      - name: smoke test binary
        run: |
          chmod +x dist/${{ matrix.asset }}
          ./dist/${{ matrix.asset }} --version
          ./dist/${{ matrix.asset }} doctor --json | head -c 200

      # Flat single-file artifacts so merge-multiple lands all four as dist/aimo-*
      - run: cp "dist/${{ matrix.asset }}" "./${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  attach:
    name: upload release assets
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aimo-*
          path: dist
          merge-multiple: true

      - name: upload to GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/aimo-linux-x64
            dist/aimo-linux-arm64
            dist/aimo-darwin-arm64
            dist/aimo-darwin-x64
