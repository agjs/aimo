<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="aimo CLI">
  <!-- Flat terminal frame; ASCII only. Rasterize to PNG for README. -->
  <rect x="36" y="76" width="440" height="360" rx="18" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <rect x="36" y="76" width="440" height="48" rx="18" fill="#1e293b"/>
  <rect x="36" y="106" width="440" height="18" fill="#1e293b"/>
  <circle cx="68" cy="100" r="8" fill="#f87171"/>
  <circle cx="96" cy="100" r="8" fill="#fbbf24"/>
  <circle cx="124" cy="100" r="8" fill="#4ade80"/>
  <rect x="52" y="140" width="408" height="280" rx="10" fill="#020617"/>
  <text
